<!doctype html><html lang="en"><meta charset="utf-8"><title>Neon Pairs grayscale faces at 44px</title><style>.board-scroll { background: rgb(20, 24, 39); border-radius: 8px; max-height: min(70dvh, 768px); padding: 6px; overflow: auto; }
.board-grid { gap: 6px; width: 100%; margin-inline: auto; display: grid; }
.card { aspect-ratio: 1 / 1; color: rgb(244, 246, 255); cursor: pointer; background: rgb(27, 32, 52); border: 2px solid rgb(117, 124, 154); border-radius: 8px; place-items: center; width: 100%; min-width: 44px; max-width: 88px; padding: 4px; scroll-margin: 6px; transition: border-color 0.12s; display: grid; position: relative; }
.card--face { background: rgb(17, 22, 37); }
.card:not(.card--matched):hover { border-color: rgb(244, 246, 255); }
.card--matched:hover { border-color: rgb(139, 234, 125); }
.card:focus-visible { outline-offset: 2px; z-index: 1; outline: rgb(255, 255, 255) solid 3px; }
.card--matched { opacity: 1; border-color: rgb(139, 234, 125); }
.card-back { aspect-ratio: 1 / 1; clip-path: polygon(50% 0px, 100% 50%, 50% 100%, 0px 50%); background: rgb(117, 124, 154); width: 28%; }
.face-artwork { width: 100%; height: 100%; display: block; }
.match-check { fill: none; stroke: rgb(139, 234, 125); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; width: 8px; height: 8px; position: absolute; bottom: 3px; right: 3px; }
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
}
.game-controls { gap: 16px; display: grid; }
.deal-controls, .field-action { flex-wrap: wrap; align-items: end; gap: 8px; display: flex; }
.size-control, .reproduction-field { gap: 6px; display: grid; }
.size-control span, .reproduction-field label { color: rgb(184, 189, 210); font-size: 14px; }
.reproduction-tools { background: rgb(20, 24, 39); border-radius: 8px; min-width: 0px; padding: 12px; }
.reproduction-tools summary { cursor: pointer; font-weight: 600; }
.reproduction-content { gap: 12px; padding-top: 12px; display: grid; }
.field-action input { flex: 1 1 180px; min-width: 0px; }
.reproduction-field textarea { resize: vertical; width: 100%; min-width: 0px; min-height: 112px; }
.control-status { color: rgb(184, 189, 210); min-height: 24px; margin: 0px; font-size: 14px; }
@media (width <= 420px) {
  .field-action input { flex-basis: 100%; }
}
:root { --lightningcss-light: ; --lightningcss-dark: initial; color-scheme: dark; color: rgb(244, 246, 255); background: rgb(9, 11, 20); font-family: system-ui, sans-serif; font-size: 16px; line-height: 24px; }
* { box-sizing: border-box; }
html, body, #root { width: 100%; min-width: 0px; min-height: 100%; margin: 0px; }
body { background: rgb(9, 11, 20); min-height: 100vh; }
button, select, input, textarea { color: rgb(244, 246, 255); max-width: 100%; font: inherit; background: rgb(20, 24, 39); border: 1px solid rgb(117, 124, 154); border-radius: 6px; padding: 8px; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline-offset: 2px; outline: rgb(255, 255, 255) solid 3px; }
button:hover { border-color: rgb(244, 246, 255); }
.game-shell { gap: 16px; width: 100%; max-width: 1120px; margin: 0px auto; padding: 16px; display: grid; }
.game-header h1 { margin: 0px; font-size: 24px; line-height: 32px; }
.game-header p { color: rgb(184, 189, 210); margin: 8px 0px 0px; font-size: 14px; }
.game-status { flex-wrap: wrap; gap: 8px 16px; display: flex; }
.game-status p { margin: 0px; }
.status-label { color: rgb(184, 189, 210); font-size: 14px; }
.win-banner { background: rgb(20, 24, 39); border: 1px solid rgb(139, 234, 125); border-radius: 8px; padding: 12px; }
.win-banner--pulse { animation: 0.6s ease-out 0s 1 normal none running win-pulse; }
@keyframes win-pulse { 
  50% { background: rgb(32, 46, 41); }
}
.turn-announcement { clip-path: inset(50%); white-space: nowrap; width: 1px; height: 1px; position: absolute; overflow: hidden; }
@media (prefers-reduced-motion: reduce) {
  .win-banner--pulse { animation: auto ease 0s 1 normal none running none; }
}
