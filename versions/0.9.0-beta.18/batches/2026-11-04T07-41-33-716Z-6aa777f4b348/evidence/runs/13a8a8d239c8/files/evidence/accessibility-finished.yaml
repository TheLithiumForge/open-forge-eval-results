- main:
  - paragraph: A memory game
  - heading "Neon Pairs" [level=1]
  - text: Grid size
  - combobox "Grid size":
    - option "4x4" [selected]
    - option "6x6"
    - option "8x8"
    - option "10x10"
    - option "12x12"
    - option "14x14"
    - option "16x16"
  - button "New Game"
  - button "Restart"
  - region "Game":
    - paragraph: "Moves: 8"
    - paragraph: "Pairs: 8/8"
    - paragraph: "Time: 0:00"
    - paragraph: "Best: 8"
    - paragraph: All pairs found in 8 moves and 0:00.
    - group "4 by 4 memory board":
      - button "Row 1, column 1, cyan solid plus, marker top, matched" [disabled]
      - button "Row 1, column 2, cyan solid chevron, marker top, matched" [disabled]
