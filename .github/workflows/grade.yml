# Grades published runs whose checks were left for later and pushes the new grades to main. The Open Forge
# repository starts it with npm run evals -- results grade, which names the Open Forge commit whose graders run.
# Every batch with waiting runs gets a job on one of the runners in the GRADE_RUNNERS variable, in turn, so
# GitHub's runners and self-hosted ones share the work. Self-hosted runners need Docker with Linux containers.
# AI judges never run here: these jobs build agent-written code, so a sign-in would share a host with it.
name: Grade published runs

on:
  workflow_dispatch:
    inputs:
      open-forge-ref:
        description: The Open Forge commit whose graders run
        required: true

# The grading jobs build agent-written code, so only the publish job gets a token that can write.
permissions:
  contents: read

concurrency:
  group: grade-published-runs
  cancel-in-progress: false

env:
  OPEN_FORGE_REPOSITORY: ${{ vars.OPEN_FORGE_REPOSITORY || 'TheLithiumForge/open-forge' }}
  # Every grader change makes a new grading version, so the graders come from one pinned commit.
  OPEN_FORGE_REF: ${{ inputs.open-forge-ref }}
  NODE_VERSION: "24.19.0"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pending.outputs.matrix }}
      any: ${{ steps.pending.outputs.any }}
    steps:
      - name: Require a pinned Open Forge commit
        run: test -n "$OPEN_FORGE_REF" || { echo "Name the Open Forge commit whose graders run."; exit 1; }
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: pending
        run: npm run --silent pending
        env:
          GRADE_RUNNERS: ${{ vars.GRADE_RUNNERS || '["ubuntu-24.04"]' }}

  grade:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: results
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.OPEN_FORGE_REPOSITORY }}
          ref: ${{ env.OPEN_FORGE_REF }}
          path: open-forge
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install the graders and the results scripts
        run: |
          npm ci --prefix open-forge/src/evals
          npm ci --prefix results --cache results/.npm-cache
      - name: Build the verifier images
        working-directory: open-forge
        run: npm run --silent evals -- images
      - name: Import the published batch
        working-directory: open-forge
        env:
          FOLDER: ${{ matrix.folder }}
        run: npm run --silent evals -- results import "../results/$FOLDER"
      # Each check holds a slot and about one core, and its verifier container takes two more.
      - name: Run the waiting checks
        working-directory: open-forge
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          cores="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN)"
          npm run --silent evals -- check "$BATCH" --missing --check-slots "$(( cores / 3 > 0 ? cores / 3 : 1 ))"
      - name: Publish the batch again with its new grades
        working-directory: open-forge
        env:
          BATCH: ${{ matrix.batch }}
        run: npm run --silent evals -- results add "$BATCH" --imported --repository ../results
      - uses: actions/upload-artifact@v4
        with:
          name: graded-${{ matrix.batch }}
          path: results/${{ matrix.folder }}
          include-hidden-files: true
          retention-days: 7

  # The grading jobs ran agent-written code, so this job treats their artifacts as data: it copies only the batch
  # folders the plan job expected, runs this repository's own scripts, and holds a token only while it pushes.
  publish:
    needs: [plan, grade]
    if: ${{ !cancelled() && needs.grade.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --cache .npm-cache
      - uses: actions/download-artifact@v4
        with:
          pattern: graded-*
          path: ${{ runner.temp }}/graded
      - name: Copy the expected graded batches and validate the repository
        env:
          GRADED: ${{ needs.plan.outputs.matrix }}
        run: |
          npm run --silent publish-graded -- "$RUNNER_TEMP/graded"
          npm run index
          npm run validate
      # Agent-written .gitignore files sit inside the evidence, so the evidence is added by force. Batches
      # published while grading ran touch other folders, so a rebase replays the grades on top of them.
      - name: Push the new grades to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git add --force versions index.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Grade published runs from run $RUN_ID"
          remote="https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git"
          for attempt in 1 2 3; do
            if git pull --rebase "$remote" main && git push "$remote" HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "main kept moving, so the grades weren't pushed."
          exit 1
