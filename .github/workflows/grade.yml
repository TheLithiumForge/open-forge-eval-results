# Grades published runs whose checks were left for later and pushes the new grades to main. The Open Forge
# repository starts it with npm run evals -- results grade, which names the Open Forge commit whose graders run.
# One job checks one run, on GitHub's own Ubuntu runners, up to 20 at a time. The verifier image is built once per
# Open Forge image set and kept in GitHub's container registry, so every check job pulls the same image.
# AI judges never run here: these jobs build agent-written code, so a sign-in would share a host with it.
name: Grade published runs

on:
  workflow_dispatch:
    inputs:
      open-forge-ref:
        description: The Open Forge commit whose graders run
        required: true

# The check jobs build agent-written code, so only the image and publish jobs get a token that can write.
permissions:
  contents: read

concurrency:
  group: grade-published-runs
  cancel-in-progress: false

env:
  OPEN_FORGE_REPOSITORY: ${{ vars.OPEN_FORGE_REPOSITORY || 'TheLithiumForge/open-forge' }}
  # Every grader change makes a new grading version, so the graders come from one pinned commit.
  OPEN_FORGE_REF: ${{ inputs.open-forge-ref }}
  NODE_VERSION: "24.19.0"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pending.outputs.matrix }}
      any: ${{ steps.pending.outputs.any }}
    steps:
      # Only main's workflow and scripts may grade, since the publish job pushes to main.
      - name: Require main and a pinned Open Forge commit
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Start grading from main."; exit 1; }
          test -n "$OPEN_FORGE_REF" || { echo "Name the Open Forge commit whose graders run."; exit 1; }
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: pending
        run: npm run --silent pending

  # Builds only from the pinned Open Forge Dockerfiles, never from agent code, so it may publish the image.
  image:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.OPEN_FORGE_REPOSITORY }}
          ref: ${{ env.OPEN_FORGE_REF }}
          path: open-forge
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --prefix open-forge/src/evals
      - name: Build the verifier image unless the registry has it
        id: publish
        working-directory: open-forge
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # The key covers every file the images build from, so any change makes a new image.
          key="$(find src/evals/images -type f | sort | xargs cat | sha256sum | cut -c1-24)"
          image="ghcr.io/${OWNER,,}/open-forge-eval-verifier:$key"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if ! docker manifest inspect "$image" > /dev/null 2>&1; then
            npm run --silent evals -- images verifier
            docker tag "$(npm run --silent evals -- images verifier --tag | tail -n 1)" "$image"
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  check:
    needs: [plan, image]
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: results
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.OPEN_FORGE_REPOSITORY }}
          ref: ${{ env.OPEN_FORGE_REF }}
          path: open-forge
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install the graders and the results scripts
        run: |
          npm ci --prefix open-forge/src/evals
          npm ci --prefix results --cache results/.npm-cache
      - name: Pull the verifier image
        working-directory: open-forge
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$(npm run --silent evals -- images verifier --tag | tail -n 1)"
          docker logout ghcr.io
      - name: Import the published batch
        working-directory: open-forge
        env:
          FOLDER: ${{ matrix.folder }}
        run: npm run --silent evals -- results import "../results/$FOLDER"
      - name: Check the run
        working-directory: open-forge
        env:
          BATCH: ${{ matrix.batch }}
          RUN: ${{ matrix.run }}
        run: npm run --silent evals -- check "$BATCH" "$RUN" --missing --check-slots 1
      - name: Publish the batch again with the run's new grades
        working-directory: open-forge
        env:
          BATCH: ${{ matrix.batch }}
        run: npm run --silent evals -- results add "$BATCH" --imported --repository ../results
      # Only what a check can add, so the publish job doesn't download a whole batch once per run.
      - uses: actions/upload-artifact@v4
        with:
          name: graded-${{ matrix.batch }}-${{ matrix.run }}
          path: |
            results/${{ matrix.folder }}/assessments/checks.jsonl
            results/${{ matrix.folder }}/artifacts.json
            results/${{ matrix.folder }}/evidence/assessments
          include-hidden-files: true
          retention-days: 7

  # The check jobs ran agent-written code, so this job treats their artifacts as data: it merges only the runs the
  # plan job expected, runs this repository's own scripts, and holds a token only while it pushes.
  publish:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.check.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --cache .npm-cache
      - uses: actions/download-artifact@v4
        with:
          pattern: graded-*
          path: ${{ runner.temp }}/graded
      - name: Merge the expected grades and validate the repository
        env:
          GRADED: ${{ needs.plan.outputs.matrix }}
        run: |
          npm run --silent publish-graded -- "$RUNNER_TEMP/graded"
          npm run index
          npm run validate
      # Agent-written .gitignore files sit inside the evidence, so the evidence is added by force. Batches
      # published while grading ran touch other folders, so a rebase replays the grades on top of them.
      - name: Push the new grades to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git add --force versions index.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Grade published runs from run $RUN_ID"
          remote="https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git"
          for attempt in 1 2 3; do
            if git pull --rebase "$remote" main && git push "$remote" HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          echo "main kept moving, so the grades weren't pushed."
          exit 1
